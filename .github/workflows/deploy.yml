name: Build and deploy

# main = development: every push and pull request is built and checked, never published.
# prod = live site:   a merge (push) to prod is built, checked and published to GitHub Pages.
# Release by merging a pull request from main into prod.
on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch: # run by hand on prod to republish

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release that is publishing; superseded dev builds can be dropped.
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build # astro check + astro build
      - run: npm run test:links
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/prod'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/prod'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
